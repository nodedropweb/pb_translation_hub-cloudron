services:
  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: drupal_root
      MYSQL_DATABASE: pb_translation_hub
      MYSQL_USER: pb_hub
      MYSQL_PASSWORD: drupal
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=db
      - PORT=9901
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  client:
    build:
      context: ./client
    ports:
      # Exposes the frontend + proxy API on port 5173. You can change this port easily.
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
