services:
  db:
    image: mariadb:11.8
    environment:
      MYSQL_ROOT_PASSWORD: drupal_root
      MYSQL_DATABASE: pb_translation_hub
      MYSQL_USER: pb_hub
      MYSQL_PASSWORD: drupal
    volumes:
      - db_data:/var/lib/mysql
      # Beim ersten Start (leeres Volume) wird der Export automatisch eingespielt.
      - ./server/data/db_export.sql.gz:/docker-entrypoint-initdb.d/db_export.sql.gz:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  server:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - DB_HOST=db
      - PORT=9901
    volumes:
      - ./server/data:/app/data
      - ./server/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    build:
      context: ./flutter_client
    ports:
      # Exposes the frontend + proxy API on port 5173.
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  db_data:
