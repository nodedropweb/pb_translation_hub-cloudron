<!DOCTYPE html>
<html>
<head>
  <!--

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI-assisted translation editor for Project Browser module metadata.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PB Translation Hub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PB Translation Hub</title>

</head>
  <style>
    body {
      background-color: #0D1B2E;
      margin: 0;
      overflow: hidden;
    }
    #preloader {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 9999;
      font-family: system-ui, -apple-system, sans-serif;
      transition: opacity 0.5s ease-out;
    }
    #preloader-logo {
      width: 160px;
      height: 160px;
      animation: logoIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      opacity: 0;
    }
    #preloader-title {
      color: #ffffff;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 28px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.3s forwards;
    }
    #preloader-sub {
      color: #6BA3C8;
      font-size: 13px;
      letter-spacing: 1.2px;
      margin-top: 6px;
      opacity: 0;
      animation: fadeUp 0.5s ease-out 0.45s forwards;
    }
    #preloader-bar-wrap {
      margin-top: 40px;
      width: 120px;
      height: 3px;
      background: #1E3A5F;
      border-radius: 4px;
      overflow: hidden;
      opacity: 0;
      animation: fadeUp 0.4s ease-out 0.6s forwards;
    }
    #preloader-bar {
      height: 100%;
      width: 30%;
      background: #4A90D9;
      border-radius: 4px;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes logoIn {
      0%   { opacity: 0; transform: scale(0.7); }
      100% { opacity: 1; transform: scale(1.0); }
    }
    @keyframes fadeUp {
      0%   { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slide {
      0%   { margin-left: -30%; }
      100% { margin-left: 130%; }
    }
  </style>

  <div id="preloader">
    <img id="preloader-logo" src="assets/assets/images/logo.png" alt="PB Translation Hub">
    <div id="preloader-title">PB Translation Hub</div>
    <div id="preloader-sub">Project Browser Localizer</div>
    <div id="preloader-bar-wrap"><div id="preloader-bar"></div></div>
  </div>

  <!-- ── CKEditor 5 Classic build (GPL 2+) ──────────────────────────────── -->
  <script src="https://cdn.ckeditor.com/ckeditor5/41.4.2/classic/ckeditor.js"></script>

  <!-- ── CKEditor dark theme (applied to div-based instances in main DOM) ── -->
  <style>
    .cke-host { box-sizing: border-box; }
    .cke-host *,
    .cke-host *::before,
    .cke-host *::after { box-sizing: border-box; }
    .cke-host .ck.ck-editor          { display:flex; flex-direction:column; height:100%; }
    .cke-host .ck.ck-editor__main    { flex:1; overflow-y:auto; }
    .cke-host .ck.ck-toolbar {
      background:#1A1F26!important; border-color:#2D3748!important;
      border-radius:0!important; padding:4px 8px!important;
    }
    .cke-host .ck.ck-toolbar .ck-toolbar__separator { background:#2D3748!important; }
    .cke-host .ck.ck-button        { color:#CBD5E0!important; border-radius:6px!important; }
    .cke-host .ck.ck-button:hover,
    .cke-host .ck.ck-button.ck-on  { background:#2D3748!important; color:#fff!important; }
    .cke-host .ck.ck-icon          { color:inherit!important; }
    .cke-host .ck.ck-dropdown__panel,
    .cke-host .ck.ck-list          { background:#1A1F26!important; border-color:#2D3748!important; }
    .cke-host .ck.ck-list__item .ck-button       { color:#CBD5E0!important; }
    .cke-host .ck.ck-list__item .ck-button:hover { background:#2D3748!important; }
    .cke-host .ck-editor__editable_inline {
      background:#0F1115!important; border:none!important;
      box-shadow:none!important; color:#E2E8F0;
      font-size:14px; line-height:1.65; min-height:140px;
      padding:12px 16px!important;
    }
    .cke-host .ck-editor__editable_inline:focus { outline:none!important; }
    .cke-host .ck-content p            { margin:0 0 .75em; }
    .cke-host .ck-content a            { color:#7C3AED; }
    .cke-host .ck-content code         { background:rgba(104,211,145,.12); color:#68D391;
                                         padding:2px 5px; border-radius:4px; font-size:.9em; }
    .cke-host .ck-content pre          { background:rgba(0,0,0,.35); padding:12px;
                                         border-radius:6px; overflow-x:auto; }
    .cke-host .ck-content blockquote   { border-left:3px solid #6366F1; margin:0;
                                         padding-left:16px; color:#A0AEC0; font-style:italic; }
    .cke-host .ck-content ul,
    .cke-host .ck-content ol           { padding-left:1.5em; margin:0 0 .75em; }
    .cke-host .ck.ck-balloon-panel     { background:#1A1F26!important; border-color:#2D3748!important; }
  </style>

  <!-- ── Glossary highlight + tooltip CSS — Farben via setTheme() steuerbar ── -->
  <style>
    /* Highlighted glossary term — CSS-Variablen für Theme-Anpassung */
    :root {
      --ck-hl-bg:     rgba(251, 191, 36, 0.22);
      --ck-hl-border: #F59E0B;
    }
    .ck-content .ck-glossary-highlight {
      background:    var(--ck-hl-bg);
      border-bottom: 2px solid var(--ck-hl-border);
      border-radius: 2px;
      cursor: help;
    }

    /* ── Floating tooltip ── */
    #_ck_glossary_tip {
      /* Default: dark theme — wird per _ckBridge.setTheme() aktualisiert */
      --tip-bg:       #1A1D22;
      --tip-border:   rgba(139,92,246,0.55);
      --tip-shadow:   rgba(0,0,0,0.65);
      --tip-brand:    #8B5CF6;
      --tip-brand-lo: rgba(139,92,246,0.18);
      --tip-text:     #F8FAFC;
      --tip-muted:    rgba(255,255,255,0.62);
      --tip-divider:  rgba(255,255,255,0.08);

      position: fixed;
      z-index: 2147483647;
      display: none;
      min-width: 220px;
      max-width: 360px;
      background: var(--tip-bg);
      border: 1px solid var(--tip-border);
      border-radius: 12px;
      padding: 13px 16px 12px;
      box-shadow: 0 12px 36px var(--tip-shadow), 0 0 0 1px var(--tip-brand-lo);
      pointer-events: none;
      font-family: Inter, system-ui, sans-serif;
      line-height: 1;
    }
    #_ck_glossary_tip ._tip-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 8px;
    }
    #_ck_glossary_tip ._tip-icon { font-size: 15px; flex-shrink: 0; }
    #_ck_glossary_tip ._tip-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--tip-brand);
      opacity: 0.72;
    }
    #_ck_glossary_tip ._tip-found {
      font-size: 13px;
      font-weight: 700;
      color: var(--tip-text);
      letter-spacing: -0.1px;
    }
    #_ck_glossary_tip ._tip-arrow {
      font-size: 12px;
      color: var(--tip-muted);
      margin: 2px 0;
    }
    #_ck_glossary_tip ._tip-preferred {
      font-size: 15px;
      font-weight: 800;
      color: var(--tip-brand);
      letter-spacing: -0.2px;
    }
    #_ck_glossary_tip ._tip-divider {
      height: 1px;
      background: var(--tip-divider);
      margin: 8px 0;
    }
    #_ck_glossary_tip ._tip-explanation {
      font-size: 12px;
      line-height: 1.6;
      color: var(--tip-muted);
      white-space: normal;
    }
  </style>

  <script>
    // ── Glossary floating tooltip (lives in document.body — always on top) ────
    (function () {
      var tip = document.createElement('div');
      tip.id = '_ck_glossary_tip';
      tip.innerHTML =
        '<div class="_tip-header">' +
          '<span class="_tip-icon">💡</span>' +
          '<div>' +
            '<div class="_tip-label">Glossar-Hinweis</div>' +
            // "Erkannte Form → Bevorzugte Übersetzung"
            '<div class="_tip-found"  id="_tip_found"></div>' +
            '<div class="_tip-arrow">↓ bevorzugte Übersetzung</div>' +
            '<div class="_tip-preferred" id="_tip_word"></div>' +
          '</div>' +
        '</div>' +
        '<div class="_tip-divider"></div>' +
        '<div class="_tip-explanation" id="_tip_exp"></div>';
      document.body.appendChild(tip);

      var _tipFound = tip.querySelector('#_tip_found');
      var _tipWord  = tip.querySelector('#_tip_word');
      var _tipExp   = tip.querySelector('#_tip_exp');
      var _tipArrow = tip.querySelector('._tip-arrow');
      var _hideTimer = null;

      function showTip(target) {
        var matched      = target.getAttribute('data-matched')      || '';
        var preferred    = target.getAttribute('data-preferred')    || '';
        var explanation  = target.getAttribute('data-explanation')  || '';
        if (!preferred) return;

        // Show the inflected form that was actually found in the text.
        // Case A: matched form differs from preferred word (e.g. "Inhalte" → "Inhalt")
        //   → show matched form small, arrow, preferred word large+purple
        // Case B: matched form equals preferred word (exact match)
        //   → just show preferred word large+purple, no arrow needed
        var isDifferent = matched && (matched.toLowerCase() !== preferred.toLowerCase());

        if (isDifferent) {
          _tipFound.textContent         = matched;
          _tipFound.style.display       = '';
          _tipFound.style.fontSize      = '13px';
          _tipFound.style.fontWeight    = '700';
          _tipFound.style.color         = 'var(--tip-text)';
          _tipArrow.style.display       = '';
          _tipWord.textContent          = preferred;
          _tipWord.style.display        = '';
        } else {
          // Exact match — preferred word IS the found word; show it prominently
          _tipFound.textContent         = preferred;
          _tipFound.style.display       = '';
          _tipFound.style.fontSize      = '15px';
          _tipFound.style.fontWeight    = '800';
          _tipFound.style.color         = 'var(--tip-brand)';
          _tipArrow.style.display       = 'none';
          _tipWord.style.display        = 'none';
        }

        _tipExp.textContent  = explanation;
        _tipExp.style.display = explanation ? '' : 'none';
        tip.querySelector('._tip-divider').style.display = explanation ? '' : 'none';

        tip.style.display = 'block';
        positionTip(target);
      }

      function positionTip(target) {
        var rect  = target.getBoundingClientRect();
        var tw    = tip.offsetWidth  || 260;
        var th    = tip.offsetHeight || 80;
        var vw    = window.innerWidth;
        var vh    = window.innerHeight;
        var GAP   = 8;

        // Prefer above; fall back to below if not enough space
        var top = rect.top - th - GAP;
        if (top < 4) top = rect.bottom + GAP;

        // Clamp horizontally
        var left = rect.left;
        if (left + tw > vw - 4) left = vw - tw - 4;
        if (left < 4) left = 4;

        tip.style.top  = top  + 'px';
        tip.style.left = left + 'px';
      }

      document.addEventListener('mouseover', function (e) {
        clearTimeout(_hideTimer);
        var el = e.target;
        while (el && el !== document.body) {
          if (el.classList && el.classList.contains('ck-glossary-highlight')) {
            showTip(el);
            return;
          }
          el = el.parentElement;
        }
        _hideTimer = setTimeout(function () { tip.style.display = 'none'; }, 80);
      });

      document.addEventListener('mouseout', function (e) {
        _hideTimer = setTimeout(function () { tip.style.display = 'none'; }, 80);
      });
    })();

    // ── Glossary: proper CKEditor plugin using model markers ─────────────────
    //
    // Uses editor.conversion.for('editingDowncast').markerToHighlight() so that
    // highlights only live in the EDITING VIEW — getData() is never polluted.
    // Markers carry affectsData:false so undo/redo ignores them too.

    var _glossaryMarkerUid = 0;

    /**
     * Escapes a string for safe use inside a RegExp pattern.
     */
    function _ckEscapeRe(s) {
      return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }

    /**
     * Applies the global glossary to a single editor via model markers.
     * Runs inside editor.model.change() so CKEditor manages the view update.
     */
    function _ckApplyGlossaryMarkers(editor) {
      var terms = window._ckBridge.globalGlossary;
      if (!terms || terms.length === 0) return;

      var model  = editor.model;
      var root   = model.document.getRoot();

      model.change(function(writer) {
        // Remove all previous glossary markers in this editor
        var existing = Array.from(model.markers.getMarkersGroup('glossaryTerm'));
        existing.forEach(function(marker) { writer.removeMarker(marker); });

        // Walk every block-level element that can hold text
        for (var ri of model.createRangeIn(root)) {
          if (ri.type !== 'elementStart') continue;
          var element = ri.item;

          // Skip elements that cannot contain text (e.g. images, tables at root level)
          try {
            if (!model.schema.checkChild(element, '$text')) continue;
          } catch(e) { continue; }

          // Build the plain text content of this element
          var text = '';
          for (var ci of model.createRangeIn(element)) {
            if (ci.type === 'text') text += ci.item.data;
          }
          if (!text) continue;

          // Find each glossary term and add a marker
          for (var t = 0; t < terms.length; t++) {
            var term = terms[t];
            if (!term.source_word) continue;

            // Build alternation from source_word + all word_forms (plural etc.)
            var allForms = [term.source_word].concat(
              Array.isArray(term.word_forms) ? term.word_forms : []
            ).filter(Boolean).map(_ckEscapeRe);
            var pattern = new RegExp(
              '\\b(' + allForms.join('|') + ')\\b', 'gi'
            );
            var match;
            while ((match = pattern.exec(text)) !== null) {
              try {
                // Encode the matched word form so the downcast converter can
                // display the exact inflected form that was found in the text.
                var matchedForm = encodeURIComponent(match[0]);
                writer.addMarker(
                  'glossaryTerm:' + term.id + ':' + (++_glossaryMarkerUid) + ':' + matchedForm,
                  {
                    usingOperation: false,  // not in undo stack
                    affectsData:    false,  // NEVER appears in getData()
                    range: writer.createRange(
                      writer.createPositionAt(element, match.index),
                      writer.createPositionAt(element, match.index + match[0].length)
                    )
                  }
                );
              } catch(_) { /* ignore invalid position — e.g. nested inline element */ }
            }
          }
        }
        console.log('[CKGlossary] Markers applied to editor, terms:', terms.length);
      });
    }

    /**
     * GlossaryHighlightPlugin — registered as extraPlugin in every ClassicEditor.
     * Registers the editingDowncast converter that turns glossaryTerm markers
     * into <span class="ck-glossary-highlight" data-tooltip="..."> elements.
     * These spans are ONLY in the editing view, never in getData() output.
     */
    function GlossaryHighlightPlugin(editor) {
      editor.conversion.for('editingDowncast').markerToHighlight({
        model: 'glossaryTerm',
        view: function(data) {
          // data.markerName = 'glossaryTerm:<termId>:<uid>'
          // markerName format: 'glossaryTerm:<termId>:<uid>:<encodedMatchedForm>'
          var parts       = data.markerName.split(':');
          var termId      = parseInt(parts[1], 10);
          // parts[3] may contain encoded '%' which itself contains ':' — but
          // encodeURIComponent never produces ':', so simple split is safe.
          var matchedForm = parts.length > 3
            ? (function(){ try { return decodeURIComponent(parts[3]); } catch(_) { return ''; } })()
            : '';
          var glossary = window._ckBridge.globalGlossary || [];
          var term     = null;
          for (var i = 0; i < glossary.length; i++) {
            if (glossary[i].id == termId) { term = glossary[i]; break; }
          }
          if (!term) return { name: 'span', classes: ['ck-glossary-highlight'] };

          return {
            name:    'span',
            classes: ['ck-glossary-highlight'],
            attributes: {
              'data-matched':     matchedForm             || term.source_word || '',
              'data-preferred':   term.preferred_word     || '',
              'data-explanation': term.explanation        || ''
            }
          };
        }
      });
    }

    // ── CKEditor bridge ───────────────────────────────────────────────────────
    window._ckBridge = {
      instances:     {},
      globalGlossary: [],
      _glossaryTimers: {},

      /**
       * Sets the global glossary and re-applies markers to all active editors.
       * Called from Flutter via dart:js after fetching /api/glossary.
       */
      setGlobalGlossary: function(termsJson) {
        try {
          window._ckBridge.globalGlossary = JSON.parse(termsJson);
        } catch(e) {
          console.warn('[CKGlossary] JSON parse error:', e);
          return;
        }
        var count = window._ckBridge.globalGlossary.length;
        console.log('[CKGlossary] setGlobalGlossary —', count, 'terms,',
            Object.keys(window._ckBridge.instances).length, 'editors active');

        Object.keys(window._ckBridge.instances).forEach(function(id) {
          _ckApplyGlossaryMarkers(window._ckBridge.instances[parseInt(id, 10)]);
        });
      },

      // id        – unique integer per editor instance
      // toolbar   – JSON string of toolbar items array
      // onReady   – called when the editor is initialised
      // onChange  – called with the current HTML on every content change
      // _attempt  – internal retry counter (do not pass from outside)
      init: function(id, toolbar, onReady, onChange, _attempt) {
        _attempt = _attempt || 0;
        var bridge = window._ckBridge;

        // Flutter's platform-view embedding is asynchronous on the first frame.
        // If the target element is not yet in the DOM, retry up to 10 times
        // with 200 ms spacing before giving up.
        var el = document.getElementById('cke_editor_' + id);
        if (!el) {
          if (_attempt < 10) {
            setTimeout(function() {
              bridge.init(id, toolbar, onReady, onChange, _attempt + 1);
            }, 200);
          } else {
            console.error('[CKBridge] no element for id=' + id + ' after retries');
          }
          return;
        }

        var items = JSON.parse(toolbar);
        ClassicEditor.create(el, {
          extraPlugins: [ GlossaryHighlightPlugin ],
          // shouldNotGroupWhenFull: alle Buttons sichtbar, kein 3-Punkte-Menü
          toolbar: { items: items, shouldNotGroupWhenFull: true },
          language: 'en',
          ui: { poweredBy: { display: false } },
        }).then(function(editor) {
          bridge.instances[id] = editor;
          onReady();

          // Falls Glossar schon geladen war als Editor fertig wird
          if (bridge.globalGlossary.length > 0) {
            _ckApplyGlossaryMarkers(editor);
          }

          editor.model.document.on('change:data', function() {
            onChange(editor.getData());
            // Nach jeder Inhaltsänderung Glossar-Marker neu setzen (debounced).
            // addMarker(affectsData:false) feuert change:data NICHT → kein Loop.
            clearTimeout(bridge._glossaryTimers[id]);
            bridge._glossaryTimers[id] = setTimeout(function() {
              if (bridge.globalGlossary.length > 0) {
                _ckApplyGlossaryMarkers(editor);
              }
            }, 300);
          });
        }).catch(function(err) {
          console.error('[CKBridge] ClassicEditor.create failed for id=' + id + ':', err);
          // Retry on creation failure — plugin or resource timing issue.
          if (_attempt < 3) {
            setTimeout(function() {
              bridge.init(id, toolbar, onReady, onChange, _attempt + 1);
            }, 500);
          }
        });
      },

      setData: function(id, html) {
        var editor = window._ckBridge.instances[id];
        if (!editor) return;
        if (editor.getData() === html) {
          // Inhalt unverändert — Marker trotzdem neu setzen falls Glossar
          // nach dem letzten setData aktualisiert wurde.
          if (window._ckBridge.globalGlossary.length > 0) {
            _ckApplyGlossaryMarkers(editor);
          }
          return;
        }
        // setData aktualisiert das Modell → change:data feuert
        // → change:data-Listener setzt Marker nach 300 ms neu.
        editor.setData(html);
      },

      destroy: function(id) {
        clearTimeout(window._ckBridge._glossaryTimers[id]);
        var editor = window._ckBridge.instances[id];
        if (editor) { editor.destroy(); delete window._ckBridge.instances[id]; }
      }
    };

    var _preloaderStart = Date.now();
    var _minDisplay = 2200; // ms — Mindestanzeigezeit für den Splash

    window.addEventListener('flutter-first-frame', function() {
      var preloader = document.getElementById('preloader');
      if (!preloader) return;
      var elapsed = Date.now() - _preloaderStart;
      var remaining = Math.max(0, _minDisplay - elapsed);
      setTimeout(function() {
        preloader.style.opacity = '0';
        setTimeout(function() { preloader.remove(); }, 500);
      }, remaining);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
