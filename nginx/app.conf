server {
    listen 3000;
    server_name localhost;

    root /app/code/web;
    index index.html;

    # Keep in sync with the multer fileSize limit in server/index.js (currently
    # 100 MB) — nginx sits in front of multer, so a lower value here rejects
    # uploads with a bare "413 Request Entity Too Large" before multer's own,
    # more specific error handling ever runs. Found live: a real content
    # backup (DB dump + category translations) already reached ~60 MB with a
    # partial dataset, comfortably exceeding the previous 50M here.
    client_max_body_size 100M;

    # cloudron/base's default nginx.conf sets Referrer-Policy: same-origin, which suppresses
    # the referrer entirely on cross-origin requests. The embedded YouTube (nocookie) help
    # videos need at least the origin to pass YouTube's embed check, or playback fails with
    # "Error 153 - video player configuration error". strict-origin-when-cross-origin matches
    # what the non-Cloudron deployment already sends and fixes this while still only exposing
    # the origin (not the full path) to third parties.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # /var/lib/nginx/* is read-only on Cloudron; redirect nginx's temp dirs to /run
    client_body_temp_path /run/client_body;
    proxy_temp_path /run/proxy_temp;
    fastcgi_temp_path /run/fastcgi_temp;
    scgi_temp_path /run/scgi_temp;
    uwsgi_temp_path /run/uwsgi_temp;

    # Serve Flutter web static files
    # Flutter uses hash-based routing by default; all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Node backend (same container, localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:9901/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy upload requests to the Node backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:9901/uploads/;
        proxy_set_header Host $host;
    }

    location /api/uploads/ {
        proxy_pass http://127.0.0.1:9901/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy raw translation file requests (for Drupal pb_localizer mirror)
    location ~ "^/[a-z]{2}/.*\.json$" {
        proxy_pass http://127.0.0.1:9901;
        proxy_set_header Host $host;
    }

    location ~ /\. {
        deny all;
    }
}
