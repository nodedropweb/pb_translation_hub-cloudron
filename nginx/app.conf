server {
    listen 3000;
    server_name localhost;

    root /app/code/web;
    index index.html;

    client_max_body_size 50M;

    # /var/lib/nginx/* is read-only on Cloudron; redirect nginx's temp dirs to /run
    client_body_temp_path /run/client_body;
    proxy_temp_path /run/proxy_temp;
    fastcgi_temp_path /run/fastcgi_temp;
    scgi_temp_path /run/scgi_temp;
    uwsgi_temp_path /run/uwsgi_temp;

    # Serve Flutter web static files
    # Flutter uses hash-based routing by default; all unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Node backend (same container, localhost)
    location /api/ {
        proxy_pass http://127.0.0.1:9901/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy upload requests to the Node backend
    location /uploads/ {
        proxy_pass http://127.0.0.1:9901/uploads/;
        proxy_set_header Host $host;
    }

    location /api/uploads/ {
        proxy_pass http://127.0.0.1:9901/uploads/;
        proxy_set_header Host $host;
    }

    # Proxy raw translation file requests (for Drupal pb_localizer mirror)
    location ~ "^/[a-z]{2}/.*\.json$" {
        proxy_pass http://127.0.0.1:9901;
        proxy_set_header Host $host;
    }

    location ~ /\. {
        deny all;
    }
}
